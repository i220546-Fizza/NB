<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#211A17"/>
      <stop offset="100%" stop-color="#0D0B0A"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fa07f" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#3A4A3A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3A4A3A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4CDA0"/>
      <stop offset="50%" stop-color="#BFA06A"/>
      <stop offset="100%" stop-color="#8a7148"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="640" fill="url(#bg)"/>
  <ellipse cx="200" cy="580" rx="120" ry="24" fill="url(#shadow)"/>
  <!-- cap -->
  <rect x="170" y="60" width="60" height="50" rx="6" fill="url(#cap)"/>
  <rect x="178" y="45" width="44" height="24" rx="4" fill="url(#cap)"/>
  <!-- neck -->
  <rect x="185" y="105" width="30" height="40" fill="#3A4A3A" opacity="0.9"/>
  <!-- body -->
  <path d="M130 145 h140 c10 0 18 8 18 18 v330 c0 40 -34 80 -88 80 s-88 -40 -88 -80 v-330 c0 -10 8 -18 18 -18 z"
        fill="url(#glass)" stroke="#BFA06A" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M150 145 h20 v420 h-20 z" fill="url(#highlight)" opacity="0.5"/>
  <path d="M260 200 h14 v300 h-14 z" fill="url(#highlight)" opacity="0.3"/>
  <!-- liquid fill line -->
  <rect x="132" y="230" width="136" height="255" fill="#3A4A3A" opacity="0.35"/>
  <!-- label -->
  <rect x="150" y="330" width="100" height="70" rx="2" fill="#0D0B0A" opacity="0.55" stroke="#D6B77C" stroke-opacity="0.6" stroke-width="1"/>
  <text x="200" y="358" font-family="Playfair Display, serif" font-size="13" fill="#D6B77C" text-anchor="middle" letter-spacing="2">NB</text>
  <text x="200" y="378" font-family="Inter, sans-serif" font-size="7" fill="#E8DED0" text-anchor="middle" letter-spacing="1.5">CLASSIC SCENTS</text>
</svg>